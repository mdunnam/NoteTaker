[package]
name = "qnote-capture-helper"
version = "0.1.0"
description = "Desktop helper that launches QNote capture from a global hotkey"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.6" }

[dependencies]
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2.3.1"
url = "2.5.4"
webbrowser = "1.0.6"